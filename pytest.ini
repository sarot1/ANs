# R1X Platform Test Configuration

[tool: pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    unit: Unit tests for individual components
    integration: Integration tests for workflows
    performance: Performance and benchmark tests
    asyncio: AsyncIO tests

[coverage:run]
source =
    core/
    memory/
    telemetry/
    modules/
    orchestrator/
    reports/

omit =
    */tests/*
    */__pycache__/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError